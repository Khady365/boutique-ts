<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini-boutique</title>
  </head>
  <body>
    <!-- En-tête -->
  <header class="entete">
    <h1>Mini-boutique</h1>
    <p>Panier : <span id="compteur">0</span> article(s)</p>
  </header>

  <!-- Zone principale -->
  <main class="page">

    <!-- Bloc produits -->
    <section>

      <!-- Barre de filtres -->
      <div class="filtres">

        <!-- Champ de recherche -->
        <input
          type="search"
          id="recherche"
          placeholder="Rechercher un produit"
        >

        <!-- Liste des catégories -->
        <select id="filtre-categorie">
          <option value="toutes">Toutes</option>
          <option value="vetements">Vêtements</option>
          <option value="chaussures">Chaussures</option>
          <option value="accessoires">Accessoires</option>
          <option value="maison">Maison</option>
        </select>

      </div>

      <!-- Grille des produits -->
      <div id="catalogue" class="grille">
      </div>

    </section>

    <!-- Panier -->
    <aside class="panier">
      <h2>Mon panier</h2>

      <ul id="lignes-panier">
      </ul>

      <p class="total">
        Total : <strong id="total">0 F CFA</strong>
      </p>
    </aside>

  </main> 
  <footer>
    <p>© 2026 - Khady Seck Mbaye. Tous droits réservés.</p>
</footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
